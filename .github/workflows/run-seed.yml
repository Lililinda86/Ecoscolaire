name: Seed Staging Database
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Staging operation to execute
        required: true
        type: choice
        default: seed
        options:
          - seed
          - secretary-collections-e2e
          - boardviewer-e2e
          - classes-e2e
          - attendance-e2e
          - staff-e2e
          - academic-periods-e2e
          - programs-e2e
          - teacher-assignments-e2e
      staging_url:
        description: Immutable Vercel Preview URL (required for the E2E operation)
        required: false
        type: string

jobs:
  seed:
    if: inputs.operation == 'seed'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm ci || npm install firebase-admin dotenv
        
      - name: Run Seed Script
        env:
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
          STAGING_TEST_SUPERADMIN_PASSWORD: ${{ secrets.STAGING_TEST_SUPERADMIN_PASSWORD }}
          STAGING_TEST_ALPHA_PASSWORD: ${{ secrets.STAGING_TEST_ALPHA_PASSWORD }}
          STAGING_TEST_BETA_PASSWORD: ${{ secrets.STAGING_TEST_BETA_PASSWORD }}
        run: npm run seed:staging

  secretary-collections-e2e:
    if: inputs.operation == 'secretary-collections-e2e'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: secretary-collections-staging-e2e
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run secretary collections staging E2E
        env:
          STAGING_APP_URL: ${{ inputs.staging_url }}
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
          STAGING_TEST_ALPHA_PASSWORD: ${{ secrets.STAGING_TEST_ALPHA_PASSWORD }}
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          STAGING_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          STAGING_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          STAGING_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/test-secretary-collections-staging.mjs
          node scripts/test-secretary-collections-staging-completion.mjs

  boardviewer-e2e:
    if: inputs.operation == 'boardviewer-e2e'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: boardviewer-staging-e2e
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run BoardViewer staging E2E
        env:
          STAGING_APP_URL: ${{ inputs.staging_url }}
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          STAGING_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          STAGING_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          STAGING_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/test-boardviewer-staging.mjs

