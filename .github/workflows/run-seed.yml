name: Seed Staging Database
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Staging operation to execute
        required: true
        type: choice
        default: seed
        options:
          - seed
          - secretary-collections-e2e
          - boardviewer-e2e
          - classes-e2e
          - attendance-e2e
          - staff-e2e
          - academic-periods-e2e
          - programs-e2e
          - teacher-assignments-e2e
          - grades-e2e
      staging_url:
        description: Immutable Vercel Preview URL (required for the E2E operation)
        required: false
        type: string

jobs:
  seed:
    if: inputs.operation == 'seed'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm ci || npm install firebase-admin dotenv
        
      - name: Run Seed Script
        env:
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
          STAGING_TEST_SUPERADMIN_PASSWORD: ${{ secrets.STAGING_TEST_SUPERADMIN_PASSWORD }}
          STAGING_TEST_ALPHA_PASSWORD: ${{ secrets.STAGING_TEST_ALPHA_PASSWORD }}
          STAGING_TEST_BETA_PASSWORD: ${{ secrets.STAGING_TEST_BETA_PASSWORD }}
        run: npm run seed:staging

  secretary-collections-e2e:
    if: inputs.operation == 'secretary-collections-e2e'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: secretary-collections-staging-e2e
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Authenticate isolated runner to exact Staging project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
          project_id: ecoscolaire-staging

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ecoscolaire-staging

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fail-closed isolated runner preflight
        shell: bash
        env:
          TRANSPORT_FIREBASE_PROJECT_ID: ecoscolaire-staging
          TRANSPORT_FIXTURE_SCHOOL_ID: transport-release-staging-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/staging'
          test "$(gcloud config get-value project)" = "$TRANSPORT_FIREBASE_PROJECT_ID"
          test "$TRANSPORT_FIXTURE_SCHOOL_ID" != 'italo-gsb'
          deployed="$(gcloud functions list --project "$TRANSPORT_FIREBASE_PROJECT_ID" --regions us-central1 --format='value(name)')"
          required=(createStudentSecure getCollectionQuote recordCashPayment reversePayment createFinancialBenefit approveFinancialBenefit closeCashDrawer)
          for function_name in "${required[@]}"; do
            printf '%s\n' "$deployed" | grep -Fx "$function_name" >/dev/null || { echo "Missing required Function: $function_name"; exit 1; }
          done
          token="$(gcloud auth print-access-token)"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"permissions":["datastore.entities.create","datastore.entities.get","datastore.entities.list","datastore.entities.update","datastore.entities.delete","firebaseauth.users.create","firebaseauth.users.get","firebaseauth.users.delete"]}' \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${TRANSPORT_FIREBASE_PROJECT_ID}:testIamPermissions")"
          for permission in datastore.entities.create datastore.entities.get datastore.entities.list datastore.entities.update datastore.entities.delete firebaseauth.users.create firebaseauth.users.get firebaseauth.users.delete; do
            printf '%s' "$response" | grep -Fq "\"$permission\"" || { echo "Missing fixture lifecycle permission: $permission"; exit 1; }
          done
          echo 'TRANSPORT_REQUIRED_FUNCTIONS_VERIFIED=true' >> "$GITHUB_ENV"
          echo 'TRANSPORT_CLEANUP_CAPABILITY_VERIFIED=true' >> "$GITHUB_ENV"

      - name: Run isolated Transport Payments contract on Staging
        env:
          TRANSPORT_RELEASE_MODE: staging
          TRANSPORT_APP_URL: ${{ inputs.staging_url }}
          TRANSPORT_FIREBASE_PROJECT_ID: ecoscolaire-staging
          GOOGLE_CLOUD_PROJECT: ecoscolaire-staging
          TRANSPORT_TEST_FIXTURE: 'true'
          TRANSPORT_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TRANSPORT_FIXTURE_SCHOOL_ID: transport-release-staging-${{ github.run_id }}-${{ github.run_attempt }}
          TRANSPORT_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          TRANSPORT_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          TRANSPORT_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          TRANSPORT_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          TRANSPORT_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/test-transport-payments-production.mjs


      - name: Run secretary collections staging E2E
        env:
          STAGING_APP_URL: ${{ inputs.staging_url }}
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
          STAGING_TEST_ALPHA_PASSWORD: ${{ secrets.STAGING_TEST_ALPHA_PASSWORD }}
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          STAGING_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          STAGING_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          STAGING_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/test-secretary-collections-staging.mjs
          node scripts/test-secretary-collections-staging-completion.mjs

  boardviewer-e2e:
    if: inputs.operation == 'boardviewer-e2e'
