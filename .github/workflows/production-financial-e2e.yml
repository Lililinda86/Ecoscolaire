name: Production Financial E2E

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_ITALO_FINANCIAL_E2E to authorize the bounded Production test
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  production-financial-e2e:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN_ITALO_FINANCIAL_E2E'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: italo-production-financial-e2e
      cancel-in-progress: false
    env:
      PRODUCTION_APP_URL: https://ecoscolaire.vercel.app
      PRODUCTION_FIREBASE_PROJECT_ID: ecoscolaire-c5861
      PRODUCTION_SCHOOL_ID: italo-gsb
      TEST_MARKER_PREFIX: ITALO-PROD-FIN-TEST-
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Guard exact Production authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirmation }}" = "RUN_ITALO_FINANCIAL_E2E"
          test "$PRODUCTION_FIREBASE_PROJECT_ID" = "ecoscolaire-c5861"
          test "$PRODUCTION_SCHOOL_ID" = "italo-gsb"
          test "$TEST_MARKER_PREFIX" = "ITALO-PROD-FIN-TEST-"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify required Production Functions
        shell: bash
        run: |
          set -euo pipefail
          required=(
            createStudentSecure enforceStudentSaasLimits recordCashPayment getCollectionQuote
            createTuitionDiscount approveTuitionDiscount createFinancialBenefit
            approveFinancialBenefit cancelFinancialBenefit closeCashDrawer
          )
          deployed="$(gcloud functions list --project "$PRODUCTION_FIREBASE_PROJECT_ID" --regions us-central1 --format='value(name)')"
          for function_name in "${required[@]}"; do
            printf '%s\n' "$deployed" | grep -Fx "$function_name" >/dev/null || {
              echo "Missing required Production Function: $function_name"
              exit 1
            }
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bounded ITALO Production financial E2E
        env:
          PRODUCTION_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          PRODUCTION_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          PRODUCTION_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          PRODUCTION_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          PRODUCTION_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: node scripts/test-production-financial-e2e.mjs

