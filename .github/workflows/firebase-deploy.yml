name: Deploy Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ecoscolaire-c5861

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build Production
        run: npm run build:production
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Build Functions
        run: |
          cd functions
          npm ci
          npm run build
          cd ..

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Guard Production Target
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Deployment blocked: Production deploys require refs/heads/main"
            exit 1
          fi
          if [ "$FIREBASE_PROJECT_ID" != "ecoscolaire-c5861" ]; then
            echo "Deployment blocked: unexpected Firebase Production project"
            exit 1
          fi
          if [ "$FIREBASE_PROJECT_ID" = "ecoscolaire-staging" ]; then
            echo "Deployment blocked: staging cannot be used as Production"
            exit 1
          fi

      - name: Deploy Firebase Rules and Functions
        run: node scripts/run-firebase-deploy-fail-closed.mjs -- firebase deploy --only firestore:rules,functions:createStudentSecure,functions:enforceStudentSaasLimits,functions:initiatePayment,functions:campayWebhook,functions:onPaymentCreated,functions:updateStudentFinancialStatus,functions:recordCashPayment,functions:reversePayment,functions:createTuitionDiscount,functions:approveTuitionDiscount,functions:createFinancialBenefit,functions:approveFinancialBenefit,functions:cancelFinancialBenefit,functions:getCollectionQuote,functions:closeCashDrawer,functions:getBoardViewerGovernanceSummary,functions:recordAuthenticatedAudit,functions:createExpense,functions:reverseExpense --project "$FIREBASE_PROJECT_ID" --non-interactive
