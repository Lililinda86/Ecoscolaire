name: Catalogue Persistence Staging
on:
  push:
    branches: [codex/catalog-persistence]
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-persistence-staging
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - run: npm run build
      - run: npm run lint
      - run: npm run lint:ci
      - run: node scripts/check-staging-credential-regressions.mjs
      - run: node --test tests/security/catalog-persistence-release.spec.mjs tests/security/settings-calendar-preservation.spec.mjs tests/security/production-backend-publication-gate.spec.mjs
      - run: npx vitest run --config vitest.limited.config.ts
      - run: npx vitest run tests/unit/transportSettings.spec.ts tests/unit/CatalogPersistence.spec.tsx
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rules
        env:
          FIREBASE_PROJECT: demo-ecoscolaire
      - run: npm install -g firebase-tools@15.25.0
      - name: Financial integration on Firestore emulator
        run: firebase emulators:exec --project demo-ecoscolaire --only firestore "node tests/functions/test-all-school-fees.cjs && node tests/functions/test-student-account-collections.cjs && node tests/functions/test-financial-advantage-workflow.cjs && node tests/functions/test-financial-tariff-snapshots.cjs && node tests/security/all-school-fees-rules.mjs"
  staging:
    if: github.ref == 'refs/heads/codex/catalog-persistence'
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    env:
      GOOGLE_CLOUD_PROJECT: ecoscolaire-staging
      VITE_FIREBASE_PROJECT_ID: ecoscolaire-staging
      VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
      EXPECTED_STAGING_SHA: ${{ github.sha }}
      ALL_FEES_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Guard isolated branch and Staging project
        run: |
          test "$GITHUB_REF" = refs/heads/codex/catalog-persistence
          test "$GOOGLE_CLOUD_PROJECT" = ecoscolaire-staging
          test "$VITE_FIREBASE_PROJECT_ID" = ecoscolaire-staging
          test "$(git rev-parse HEAD)" = "$EXPECTED_STAGING_SHA"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - run: npm install -g firebase-tools@15.25.0
      - name: Deploy versioned settings callable to Staging only
        run: node scripts/run-firebase-deploy-fail-closed.mjs -- firebase deploy --only functions:manageSchoolFee,functions:getSchoolFeeCatalog --project ecoscolaire-staging --non-interactive
      - name: Verify settings callable is ACTIVE
        run: test "$(gcloud functions describe manageSchoolFee --project ecoscolaire-staging --region us-central1 --format='value(status)')" = ACTIVE
      - name: Find and verify immutable Preview for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-limited-staging-preview.mjs
      - run: npx playwright install --with-deps chromium
      - name: Transport persistence actual UI and backend validation
        run: node scripts/test-transport-policy-persistence-staging.mjs
      - name: Global Settings actual UI validation
        run: node scripts/test-settings-global-staging.mjs
      - name: Financial collection actual UI validation with synthetic payments only
        run: node scripts/test-all-school-fees-staging.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-persistence-staging-evidence
          path: |
            transport-persistence-evidence.json
            all-fees-*.png
            all-fees-receipt.pdf
          if-no-files-found: ignore
