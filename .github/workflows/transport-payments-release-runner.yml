name: Transport Payments Isolated Release Runner

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact isolated operation
        required: true
        default: transport
        type: choice
        options: [transport, lot1_tuition_ui, lot2_transport_student]
      mode:
        description: Exact isolated target
        required: true
        type: choice
        options: [staging, production]
      confirmation:
        description: Exact confirmation for the selected operation and target
        required: true
        type: string
      expected_sha:
        description: Exact deployed Staging SHA required by lot1_tuition_ui
        required: false
        type: string
      app_url:
        description: Immutable Staging Preview URL or https://ecoscolaire.vercel.app
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  isolated-transport-release:
    if: >-
      inputs.operation == 'transport' &&
      ((inputs.mode == 'staging' && github.ref == 'refs/heads/staging' &&
        inputs.confirmation == 'RUN_ISOLATED_TRANSPORT_STAGING') ||
       (inputs.mode == 'production' && github.ref == 'refs/heads/main' &&
        inputs.confirmation == 'RUN_ISOLATED_TRANSPORT_PRODUCTION'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode }}
    timeout-minutes: 45
    concurrency:
      group: transport-payments-isolated-${{ inputs.mode }}
      cancel-in-progress: false
    env:
      TRANSPORT_RELEASE_MODE: ${{ inputs.mode }}
      TRANSPORT_APP_URL: ${{ inputs.app_url }}
      TRANSPORT_FIREBASE_PROJECT_ID: ${{ inputs.mode == 'production' && 'ecoscolaire-c5861' || 'ecoscolaire-staging' }}
      GOOGLE_CLOUD_PROJECT: ${{ inputs.mode == 'production' && 'ecoscolaire-c5861' || 'ecoscolaire-staging' }}
      TRANSPORT_TEST_FIXTURE: 'true'
      TRANSPORT_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      TRANSPORT_FIXTURE_SCHOOL_ID: transport-release-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify exact-SHA deployment succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TRANSPORT_RELEASE_MODE" = staging ]; then
            deployment_workflow='deploy-staging.yml'
            expected_branch='staging'
          elif [ "$TRANSPORT_RELEASE_MODE" = production ]; then
            deployment_workflow='firebase-deploy.yml'
            expected_branch='main'
          else
            echo "Unsupported release mode: $TRANSPORT_RELEASE_MODE"
            exit 1
          fi
          runs_json="$(mktemp)"
          trap 'rm -f "$runs_json"' EXIT
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${deployment_workflow}/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f branch="$expected_branch" \
            -f event=push \
            -f per_page=100 > "$runs_json"
          node scripts/verify-exact-deployment-run.mjs \
            "$runs_json" "$GITHUB_SHA" ".github/workflows/${deployment_workflow}" "$expected_branch"
          echo 'TRANSPORT_REQUIRED_FUNCTIONS_VERIFIED=true' >> "$GITHUB_ENV"

      - name: Authenticate Staging keylessly with its dedicated runner identity
        if: inputs.mode == 'staging'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/411364288790/locations/global/workloadIdentityPools/italo-transport-staging/providers/github-ecoscolaire-staging
          service_account: italo-transport-runner-staging@ecoscolaire-staging.iam.gserviceaccount.com

      - name: Authenticate Production keylessly
        if: inputs.mode == 'production'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Fail-closed target, deployment and cleanup capability preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TRANSPORT_RELEASE_MODE" = production ]; then
            expected_ref='refs/heads/main'
          elif [ "$TRANSPORT_RELEASE_MODE" = staging ]; then
            expected_ref='refs/heads/staging'
          else
            echo "Unsupported release mode: $TRANSPORT_RELEASE_MODE"
            exit 1
          fi
          test "$GITHUB_REF" = "$expected_ref"
          test "$(gcloud config get-value project)" = "$TRANSPORT_FIREBASE_PROJECT_ID"
          test "$TRANSPORT_FIXTURE_SCHOOL_ID" != "italo-gsb"
          if [ "$TRANSPORT_RELEASE_MODE" = production ]; then
            test "$TRANSPORT_APP_URL" = "https://ecoscolaire.vercel.app"
          else
            printf '%s' "$TRANSPORT_APP_URL" | grep -Eq '^https://ecoscolaire-[a-z0-9]+-linda-lemofouet-s-projects\.vercel\.app$'
          fi
          test "$TRANSPORT_REQUIRED_FUNCTIONS_VERIFIED" = true
          token="$(gcloud auth print-access-token)"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"permissions":["datastore.entities.create","datastore.entities.get","datastore.entities.list","datastore.entities.update","datastore.entities.delete","firebaseauth.users.create","firebaseauth.users.get","firebaseauth.users.delete"]}' \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${TRANSPORT_FIREBASE_PROJECT_ID}:testIamPermissions")"
          returned_permissions_json="$(printf '%s' "$response" | jq -ce '
            if (type == "object")
              and ((.permissions // []) | type == "array")
              and ((.permissions // []) | all(type == "string"))
            then (.permissions // [])
            else error("invalid testIamPermissions response")
            end
          ')"
          required_permissions=(
            datastore.entities.create
            datastore.entities.get
            datastore.entities.list
            datastore.entities.update
            datastore.entities.delete
            firebaseauth.users.create
            firebaseauth.users.get
            firebaseauth.users.delete
          )
          mapfile -t returned_permissions < <(printf '%s' "$returned_permissions_json" | jq -r '.[]')
          printf 'Expected fixture lifecycle permissions:\n'
          printf -- '- %s\n' "${required_permissions[@]}"
          printf 'Returned fixture lifecycle permissions:\n'
          if [ "${#returned_permissions[@]}" -eq 0 ]; then
            echo '- (none)'
          else
            printf -- '- %s\n' "${returned_permissions[@]}"
          fi
          missing_permissions=()
          for permission in "${required_permissions[@]}"; do
            printf '%s\n' "${returned_permissions[@]}" | grep -Fxq "$permission" || missing_permissions+=("$permission")
          done
          if [ "${#missing_permissions[@]}" -gt 0 ]; then
            echo 'Missing fixture lifecycle permissions:'
            for permission in "${missing_permissions[@]}"; do
              echo "- $permission"
            done
            exit 1
          fi
          echo 'TRANSPORT_CLEANUP_CAPABILITY_VERIFIED=true' >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated Transport release contract with Staging Firebase client config
        if: inputs.mode == 'staging'
        env:
          TRANSPORT_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          TRANSPORT_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          TRANSPORT_FIREBASE_CLIENT_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          TRANSPORT_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          TRANSPORT_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          TRANSPORT_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/test-transport-payments-production.mjs

      - name: Run isolated Transport release contract with Production Firebase client config
        if: inputs.mode == 'production'
        env:
          TRANSPORT_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          TRANSPORT_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          TRANSPORT_FIREBASE_CLIENT_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          TRANSPORT_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          TRANSPORT_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          TRANSPORT_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/test-transport-payments-production.mjs

  lot1-tuition-ui:
    if: >-
      inputs.operation == 'lot1_tuition_ui' &&
      inputs.mode == 'staging' &&
      github.ref == 'refs/heads/staging' &&
      inputs.confirmation == 'RUN_LOT1_STAGING_UI'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/payment-forward-recovery-staging-ui.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      app_url: ${{ inputs.app_url }}
      confirmation: ${{ inputs.confirmation }}
    secrets: inherit

  lot2-transport-student-ui:
    if: >-
      inputs.operation == 'lot2_transport_student' &&
      inputs.mode == 'staging' &&
      github.ref == 'refs/heads/staging' &&
      inputs.confirmation == 'RUN_LOT2_TRANSPORT_STUDENT_UI'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/student-transport-staging-ui.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      app_url: ${{ inputs.app_url }}
      confirmation: ${{ inputs.confirmation }}
    secrets: inherit
