name: All school fees safety
on:
  pull_request:
  push:
    branches: [codex/encaissement-all-fees]
permissions:
  contents: read
jobs:
  financial-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - run: npm run typecheck:frontend
      - run: npx eslint functions/src/schoolFeeCatalog.ts functions/src/studentFeeAssignments.ts functions/src/studentTransportPlan.ts src/components/Settings/SchoolFeeCatalog.tsx --max-warnings=0
      - run: node scripts/check-staging-credential-regressions.mjs
      - run: node --check scripts/test-all-school-fees-staging.mjs
      - run: node --test tests/security/all-school-fees-staging-runner.spec.mjs
      - run: node tests/functions/test-transport-paid-cycles.cjs
      - run: node tests/functions/test-secretary-collection-calculations.cjs
      - run: npm install -g firebase-tools@15.25.0
      - run: firebase emulators:exec --project demo-ecoscolaire --only firestore "node tests/functions/test-all-school-fees.cjs && node tests/functions/test-student-account-collections.cjs && node tests/functions/test-financial-advantage-workflow.cjs && node tests/security/all-school-fees-rules.mjs"
      - run: npx vitest run tests/unit/StudentAccountCollection.spec.tsx tests/unit/StudentAccountBenefitsDrawer.spec.tsx tests/unit/AdvantageRequestPreview.spec.tsx tests/unit/studentAccountReceipt.spec.ts
