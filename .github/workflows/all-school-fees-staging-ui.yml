name: All school fees Staging validation
on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
      app_url:
        required: true
        type: string
permissions:
  actions: read
  contents: read
  id-token: write
jobs:
  all-fees-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    concurrency:
      group: all-school-fees-staging-validation
      cancel-in-progress: false
    env:
      EXPECTED_STAGING_SHA: ${{ inputs.expected_sha }}
      STAGING_APP_URL: ${{ inputs.app_url }}
      ALL_FEES_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      GOOGLE_CLOUD_PROJECT: ecoscolaire-staging
      VITE_FIREBASE_PROJECT_ID: ecoscolaire-staging
      VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify exact Staging backend and frontend release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/staging
          test "$GITHUB_SHA" = "$EXPECTED_STAGING_SHA"
          printf '%s' "$STAGING_APP_URL" | grep -Eq '^https://ecoscolaire-[a-z0-9]+-linda-lemofouet-s-projects\.vercel\.app$'
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-staging.yml/runs" -f head_sha="$EXPECTED_STAGING_SHA" -f branch=staging -f event=push -f per_page=100 > /tmp/all-fees-runs.json
          node scripts/verify-exact-deployment-run.mjs /tmp/all-fees-runs.json "$EXPECTED_STAGING_SHA" '.github/workflows/deploy-staging.yml' staging
          deployment_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments" -f sha="$EXPECTED_STAGING_SHA" -f environment=Preview -f per_page=100 --jq '.[0].id')"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" | jq -e --arg url "$STAGING_APP_URL" 'map(select(.state == "success" and .environment_url == $url)) | length >= 1'
          echo 'TARGET_DEPLOYMENT_VERIFIED=true' >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/411364288790/locations/global/workloadIdentityPools/italo-transport-staging/providers/github-ecoscolaire-staging
          service_account: italo-transport-runner-staging@ecoscolaire-staging.iam.gserviceaccount.com
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-all-school-fees-staging.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-fees-responsive-staging
          path: all-fees-*.png
          if-no-files-found: ignore
