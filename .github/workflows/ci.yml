name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  secret-guard:
    name: Secret Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test secret guard
        run: node --test tests/security/secret-guard.spec.mjs
      - name: Reject tracked staging credentials
        run: node scripts/check-staging-credential-regressions.mjs
      - name: Validate production deployment manifest
        run: npm run test:production-workflow

      - name: Validate staging collections E2E safety contract
        run: node --check scripts/test-secretary-collections-staging.mjs && node --test tests/security/staging-collections-e2e.spec.mjs tests/security/staging-firebase-precheck.spec.mjs

      - name: Validate Production financial E2E safety contract
        run: node --check scripts/test-production-financial-e2e.mjs && node --test tests/security/production-financial-e2e.spec.mjs

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # TODO(E3.1b): frontend lint debt (305 errors)
      # - name: Lint
      #   run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Vercel environment routing
        run: npm run test:vercel-build

      - name: Secretary collections UI tests
        run: npx vitest run tests/unit/FinancialBenefitsPanel.spec.tsx tests/unit/paymentReceipt.spec.ts

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  functions-ci:
    name: Functions CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Root Test Dependencies
        run: npm ci

      - name: Install Dependencies
        run: npm ci
        working-directory: ./functions

      # TODO(E3.1b): functions ESLint flat config debt
      # - name: Lint
      #   run: npm run lint
      #   working-directory: ./functions

      - name: Build
        run: npm run build
        working-directory: ./functions

      - name: Unit Tests
        run: |
          node tests/functions/test-import-job-processor.cjs
          node tests/functions/test-student-import-sweeper.cjs
          node tests/functions/test-student-import-lease.cjs
          node tests/functions/test-student-import-recovery.cjs
          node tests/functions/test-student-import-bulk-writer.cjs
          node tests/functions/test-student-finance-projection.cjs
          node tests/functions/test-secretary-collection-calculations.cjs
          node tests/functions/test-academic-resolvers.cjs
          node tests/functions/test-ensure-class-program-draft.cjs
          node tests/functions/test-publish-class-program-draft.cjs
          node tests/functions/test-bulk-add-subjects.cjs
          node tests/functions/test-boardviewer-governance.cjs

      - name: Test Secure Student Creation
        run: npm run test:functions:secure-student
        env:
          FIREBASE_PROJECT: demo-ecoscolaire

      - name: Test Secretary Collections
        run: npm run test:functions:secretary-collections
        env:
          FIREBASE_PROJECT: demo-ecoscolaire

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: functions-lib
          path: functions/lib/
          retention-days: 7

  firestore-rules-ci:
    name: Firestore Rules CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Test Firestore Rules
        run: npm run test:rules
        env:
          FIREBASE_PROJECT: demo-ecoscolaire
