name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed Staging SHA for the isolated LOT 1 UI validation
        required: true
        type: string
      app_url:
        description: Immutable Vercel Staging URL for the exact SHA
        required: true
        type: string
      confirmation:
        description: Exact confirmation for the selected bounded Staging operation
        required: true
        type: string

permissions:
  contents: read

jobs:
  frontend-ci:
    if: github.event_name == 'push'
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build:staging
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ecoscolaire-staging
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}

      - name: Validate Vercel environment routing
        run: npm run test:vercel-build

      - name: Secretary collections UI tests
        run: npx vitest run tests/unit/FinancialBenefitsPanel.spec.tsx tests/unit/StudentAccountBenefitsDrawer.spec.tsx tests/unit/paymentReceipt.spec.ts tests/unit/studentAccountReceipt.spec.ts tests/unit/StudentAccountCollection.spec.tsx tests/unit/TeacherAssignmentsPanel.spec.tsx tests/unit/TuitionDeadlineSettings.spec.tsx

  functions-ci:
    if: github.event_name == 'push'
    name: Functions CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "functions/package-lock.json"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Dependencies
        run: npm ci
        working-directory: ./functions

      - name: Build
        run: npm run build
        working-directory: ./functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.25.0

      - name: Unit Tests
        run: |
          node tests/functions/test-student-import-sweeper.cjs
          node tests/functions/test-student-import-lease.cjs
          node tests/functions/test-student-import-recovery.cjs
          node tests/functions/test-student-import-bulk-writer.cjs
          node tests/functions/test-academic-resolvers.cjs
          firebase emulators:exec --project demo-school --only firestore "node tests/functions/test-class-program-lifecycle.cjs"
          firebase emulators:exec --project demo-school --only firestore "node tests/functions/test-manage-academic-period.cjs"
          node tests/functions/test-secretary-collection-calculations.cjs
          node tests/functions/test-boardviewer-governance.cjs
          node tests/functions/test-authenticated-audit.cjs
          node tests/functions/test-expense-ledger.cjs
          node tests/functions/test-manage-teacher-assignment.cjs

      - name: Emulator Tests
        run: |
          firebase emulators:exec \
            --project demo-school \
            --only firestore,auth \
            "node tests/functions/test-update-academic-year-bounds.cjs"

      - name: Secretary Collections Emulator Tests
        run: npm run test:functions:secretary-collections

  firestore-rules-ci:
    if: github.event_name == 'push'
    name: Firestore Rules CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Test Firestore Rules
        run: npm run test:rules
        env:
          FIREBASE_PROJECT: demo-ecoscolaire

  deploy-firebase:
    if: github.event_name == 'push'
    name: Deploy to Staging
    needs: [frontend-ci, functions-ci, firestore-rules-ci]
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_PROJECT_ID: ecoscolaire-staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Guard Production and Branch
        run: |
          if [ "$GITHUB_REF_NAME" != "staging" ]; then
            echo "Deployment blocked: branch is not staging"
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Deployment blocked: Firebase project is empty"
            exit 1
          fi
          if [ "$FIREBASE_PROJECT_ID" != "ecoscolaire-staging" ]; then
            echo "Deployment blocked: unexpected Firebase project"
            exit 1
          fi
          if [ "$FIREBASE_PROJECT_ID" = "ecoscolaire-c5861" ]; then
            echo "Deployment blocked: production deployment forbidden"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions

      - name: Build Functions
        run: npm run build
        working-directory: ./functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.25.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}

      - name: Collect Staging Function inventories
        run: |
          gcloud functions list \
            --project "$FIREBASE_PROJECT_ID" \
            --regions us-central1 \
            --format=json \
            > /tmp/staging-functions-gen1.json
          gcloud functions list \
            --v2 \
            --project "$FIREBASE_PROJECT_ID" \
            --regions us-central1 \
            --format=json \
            > /tmp/staging-functions-gen2.json

      - name: Verify Staging Function deployment contract
        run: |
          node scripts/verify-staging-function-deployment-contract.mjs \
            /tmp/staging-functions-gen1.json \
            /tmp/staging-functions-gen2.json \
            "$FIREBASE_PROJECT_ID" \
            us-central1

      - name: Deploy Firebase Backend
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore:rules,firestore:indexes,storage,functions:approveFinancialBenefit,functions:approveTuitionDiscount,functions:archiveClassProgram,functions:archiveWeeklyAssessment,functions:assignStudentToClass,functions:bulkAddSubjectsToClasses,functions:campayWebhook,functions:cancelFinancialBenefit,functions:closeCashDrawer,functions:createExpense,functions:createFinancialBenefit,functions:createLessonPreparationUpload,functions:createSaaSCheckout,functions:createStudentSecure,functions:createTuitionDiscount,functions:dailySubscriptionCheck,functions:deactivateTeacherAssignment,functions:enforceStudentSaasLimits,functions:ensureClassProgramDraft,functions:ensureExpectedLessonPreparations,functions:ensureWeeklyAssessmentDraft,functions:generateWeeklyAssessment,functions:getBoardViewerGovernanceSummary,functions:getCollectionQuote,functions:getStudentFinancialAccount,functions:getTeacherAssignmentCandidates,functions:initiatePayment,functions:linkStaffToUser,functions:manageAcademicPeriod,functions:manageEvaluation,functions:manageReportCard,functions:manageStaff,functions:manageTeacherAssignment,functions:markWeeklyAssessmentReadyToPrint,functions:mockConfirmPayment,functions:onPaymentCreated,functions:processStudentImportJob,functions:publishClassProgramDraft,functions:recordAuthenticatedAudit,functions:recordCashCollection,functions:recordCashPayment,functions:recordGradesBatch,functions:recordStudentAttendance,functions:recordWeeklyAssessmentTeacherValidation,functions:reverseCashCollection,functions:reverseExpense,functions:reversePayment,functions:saveLessonPreparationReview,functions:saveWeeklyAssessmentEdits,functions:seedDefaultSubjectCatalog,functions:setPrimaryTeacherAssignment,functions:startLessonPreparationAnalysis,functions:sweepZombieImportJobs,functions:unlinkStaffFromUser,functions:updateAcademicYearBounds,functions:updateClassProgramDraft,functions:updateStudentFinancialStatus,functions:validateLessonPreparation,functions:verifySaaSPayment --non-interactive

  lot1-staging-ui:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'RUN_LOT1_STAGING_UI'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/payment-forward-recovery-staging-ui.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      app_url: ${{ inputs.app_url }}
      confirmation: ${{ inputs.confirmation }}
    secrets: inherit

  pedagogy-lot-a-staging:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.confirmation == 'RUN_PEDAGOGY_LOT_A_STAGING' ||
      inputs.confirmation == 'RUN_PEDAGOGY_LOT_A_STAGING_VALIDATE')
    name: Deploy and validate Pedagogy Lot A
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_PROJECT_ID: ecoscolaire-staging
      STAGING_APP_URL: ${{ inputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Guard exact SHA, Preview and Production
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$FIREBASE_PROJECT_ID" = "ecoscolaire-staging"
          test "$FIREBASE_PROJECT_ID" != "ecoscolaire-c5861"
          printf '%s' "$STAGING_APP_URL" | grep -Eq '^https://ecoscolaire-git-codex-pedagogy-lot-a-linda-lemofouet-s-projects\.vercel\.app$'

      - run: npm ci
      - run: npm ci
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_A_STAGING'
        working-directory: functions
      - run: npm --prefix functions run build
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_A_STAGING'
      - run: npm install -g firebase-tools@15.25.0
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_A_STAGING'

      - name: Authenticate to Staging only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Lot A Functions, Rules and indexes
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_A_STAGING'
        run: >-
          firebase deploy --project "$FIREBASE_PROJECT_ID" --non-interactive
          --only
          "functions:adoptCurriculumProgram,functions:ensureTeachingWeeks,functions:ensureTeachingPlanDraft,functions:generateTeachingPlanProposal,functions:saveTeachingPlanAdjustments,functions:recordTeacherPlanValidation,functions:archiveTeachingPlan,firestore:rules,firestore:indexes"

      - name: Curriculum seed dry-run
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_A_STAGING'
        run: node scripts/seed-pedagogy-curriculum.mjs --project=ecoscolaire-staging

      - name: Apply versioned mock curriculum seed
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_A_STAGING'
        run: node scripts/seed-pedagogy-curriculum.mjs --project=ecoscolaire-staging --apply

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Bounded Staging functional validation
        timeout-minutes: 5
        env:
          PEDAGOGY_STAGING_E2E: "true"
          PEDAGOGY_FIREBASE_PROJECT_ID: ecoscolaire-staging
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: >-
          npx playwright test tests/pedagogy-lot-a-emulator-e2e.spec.ts
          --config=playwright.pedagogy-staging.config.ts --workers=1

  pedagogy-lot-b-staging:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.confirmation == 'RUN_PEDAGOGY_LOT_B_STAGING' ||
      inputs.confirmation == 'RUN_PEDAGOGY_LOT_B_STAGING_VALIDATE')
    name: Deploy and validate Pedagogy Lot B
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_PROJECT_ID: ecoscolaire-staging
      STAGING_APP_URL: ${{ inputs.app_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Guard exact SHA, Preview and Production
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$FIREBASE_PROJECT_ID" = "ecoscolaire-staging"
          test "$FIREBASE_PROJECT_ID" != "ecoscolaire-c5861"
          printf '%s' "$STAGING_APP_URL" | grep -Eq '^https://(ecoscolaire-git-codex-pedagogy-lot-b|ecoscolaire-4i6jij2bl)-linda-lemofouet-s-projects\.vercel\.app$'
      - run: npm ci
      - run: npm ci
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_B_STAGING'
        working-directory: functions
      - run: npm --prefix functions run build
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_B_STAGING'
      - run: npm install -g firebase-tools@15.25.0
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_B_STAGING'
      - name: Authenticate to Staging only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Lot B Functions, Rules, Storage and indexes
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_B_STAGING'
        run: >-
          firebase deploy --project "$FIREBASE_PROJECT_ID" --non-interactive
          --only
          "functions:ensureExpectedLessonPreparations,functions:createLessonPreparationUpload,functions:startLessonPreparationAnalysis,functions:saveLessonPreparationReview,functions:validateLessonPreparation,firestore:rules,firestore:indexes,storage"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Bounded Staging Lot A regression
        timeout-minutes: 5
        env:
          PEDAGOGY_STAGING_E2E: "true"
          PEDAGOGY_FIREBASE_PROJECT_ID: ecoscolaire-staging
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test tests/pedagogy-lot-a-emulator-e2e.spec.ts --config=playwright.pedagogy-staging.config.ts --workers=1
      - name: Bounded Staging Lot B functional validation and cleanup
        timeout-minutes: 8
        env:
          PEDAGOGY_STAGING_E2E: "true"
          PEDAGOGY_FIREBASE_PROJECT_ID: ecoscolaire-staging
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test tests/pedagogy-lot-b-emulator-e2e.spec.ts --config=playwright.pedagogy-staging.config.ts --workers=1

  pedagogy-lot-c-staging:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.confirmation == 'RUN_PEDAGOGY_LOT_C_STAGING' ||
      inputs.confirmation == 'RUN_PEDAGOGY_LOT_C_STAGING_VALIDATE')
    name: Deploy and validate Pedagogy Lot C
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_PROJECT_ID: ecoscolaire-staging
      STAGING_APP_URL: ${{ inputs.app_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Guard exact SHA, Preview and Production
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$FIREBASE_PROJECT_ID" = "ecoscolaire-staging"
          test "$FIREBASE_PROJECT_ID" != "ecoscolaire-c5861"
          printf '%s' "$STAGING_APP_URL" | grep -Eq '^https://ecoscolaire-git-codex-pedagogy-lot-c-linda-lemofouet-s-projects\.vercel\.app$'
      - run: npm ci
      - run: npm ci
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_C_STAGING'
        working-directory: functions
      - run: npm --prefix functions run build
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_C_STAGING'
      - run: npm install -g firebase-tools@15.25.0
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_C_STAGING'
      - name: Authenticate to Staging only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Lot C Functions, Firestore Rules and indexes
        if: inputs.confirmation == 'RUN_PEDAGOGY_LOT_C_STAGING'
        run: >-
          firebase deploy --project "$FIREBASE_PROJECT_ID" --non-interactive
          --only
          "functions:ensureWeeklyAssessmentDraft,functions:generateWeeklyAssessment,functions:saveWeeklyAssessmentEdits,functions:recordWeeklyAssessmentTeacherValidation,functions:markWeeklyAssessmentReadyToPrint,functions:archiveWeeklyAssessment,firestore:rules,firestore:indexes"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Bounded Staging Lot A regression
        timeout-minutes: 5
        env: { PEDAGOGY_STAGING_E2E: "true", PEDAGOGY_FIREBASE_PROJECT_ID: ecoscolaire-staging, VERCEL_AUTOMATION_BYPASS_SECRET: "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" }
        run: npx playwright test tests/pedagogy-lot-a-emulator-e2e.spec.ts --config=playwright.pedagogy-staging.config.ts --workers=1
      - name: Bounded Staging Lot B regression
        timeout-minutes: 8
        env: { PEDAGOGY_STAGING_E2E: "true", PEDAGOGY_FIREBASE_PROJECT_ID: ecoscolaire-staging, VERCEL_AUTOMATION_BYPASS_SECRET: "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" }
        run: npx playwright test tests/pedagogy-lot-b-emulator-e2e.spec.ts --config=playwright.pedagogy-staging.config.ts --workers=1
      - name: Bounded Staging Lot C functional validation and cleanup
        timeout-minutes: 8
        env: { PEDAGOGY_STAGING_E2E: "true", PEDAGOGY_FIREBASE_PROJECT_ID: ecoscolaire-staging, VERCEL_AUTOMATION_BYPASS_SECRET: "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" }
        run: npx playwright test tests/pedagogy-lot-c-emulator-e2e.spec.ts --config=playwright.pedagogy-staging.config.ts --workers=1
