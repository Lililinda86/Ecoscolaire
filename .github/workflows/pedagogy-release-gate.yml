name: Pedagogy Lots A + B + C Release Gate

on:
  push:
    branches: [codex/pedagogy-lot-b, codex/pedagogy-lot-c, codex/pedagogy-finalization-public, codex/pedagogy-resource-library, codex/pedagogy-observation-corrections]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact Staging SHA for live synthetic validation
        required: false
        type: string
      app_url:
        description: Optional immutable Staging Preview URL
        required: false
        type: string
      confirmation:
        description: RUN_PEDAGOGY_STAGING_SYNTHETIC or RECOVER_SYNTHETIC_RESULTS_34053765899
        required: false
        type: string

permissions:
  contents: read

jobs:
  recover-interrupted-synthetic-checkpoint:
    if: github.ref == 'refs/heads/staging' && inputs.confirmation == 'RECOVER_SYNTHETIC_RESULTS_34053765899'
    needs: [static-gates, emulator-gates]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    concurrency:
      group: pedagogy-staging-synthetic-validation
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
      - name: Recover only the interrupted synthetic results fixture
        env:
          GH_TOKEN: ${{ github.token }}
          PEDAGOGY_RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/recover-pedagogy-results-checkpoint.mjs --delete-exact-fixture
  exact-staging:
    if: github.ref == 'refs/heads/staging' && inputs.confirmation == 'RUN_PEDAGOGY_STAGING_SYNTHETIC'
    needs: [static-gates, emulator-gates]
    permissions:
      contents: read
      actions: read
      deployments: read
    uses: ./.github/workflows/pedagogy-staging-validation.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      app_url: ${{ inputs.app_url }}
      confirmation: ${{ inputs.confirmation }}
    secrets: inherit
  static-gates:
    name: Pedagogy static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Typecheck frontend and Functions
        run: npm run typecheck
      - name: Lint Pedagogy only
        run: npx eslint "functions/src/pedagogy/**/*.ts" "src/features/pedagogy/**/*.{ts,tsx}" "tests/unit/pedagogyDomain.spec.ts" "tests/unit/pedagogyPreparations.spec.ts" "tests/unit/pedagogyWeeklyAssessments.spec.ts" "tests/security/pedagogy-rules.spec.mjs" "tests/security/pedagogy-lot-b-rules.spec.mjs" "tests/security/pedagogy-lot-c-rules.spec.mjs" "tests/security/pedagogy-storage-rules.spec.mjs" "tests/pedagogy-lot-a-emulator-e2e.spec.ts" "tests/pedagogy-lot-b-emulator-e2e.spec.ts" "tests/pedagogy-lot-c-emulator-e2e.spec.ts" --max-warnings=0
      - name: Additional pedagogy regression lint
        run: npx eslint "tests/unit/pedagogy*.spec.{ts,tsx}" "tests/pedagogy-results-emulator-e2e.spec.ts" --max-warnings=0
      - name: Full unit regression
        run: npx vitest run --config vitest.config.ts
      - name: Functions tests and build
        run: npm run test:functions
      - name: Frontend build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: emulator-api-key
          VITE_FIREBASE_AUTH_DOMAIN: localhost
          VITE_FIREBASE_PROJECT_ID: demo-ecoscolaire
          VITE_FIREBASE_STORAGE_BUCKET: demo-ecoscolaire.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

  emulator-gates:
    name: Pedagogy Rules and E2E
    runs-on: ubuntu-latest
    env:
      PEDAGOGY_SAFE_CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-pedagogy-emulators-${{ hashFiles('firebase.json') }}
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm --prefix functions run build
      - name: Isolated disposable emulator secret override
        run: node scripts/prepare-pedagogy-emulator.mjs demo-ecoscolaire
      - name: Teaching confirmation Functions authorization and concurrency
        run: npx firebase-tools@15.25.0 emulators:exec --project demo-ecoscolaire --only firestore "node tests/functions/test-pedagogy-teaching-emulator.cjs && node tests/functions/test-pedagogy-observations-emulator.cjs && node tests/functions/test-pedagogy-friday-emulator.cjs && node tests/functions/test-pedagogy-results-emulator.cjs"
      - run: npx playwright install --with-deps chromium
      - name: Synthetic bilingual A4 print regression
        env:
          PEDAGOGY_PDFTOTEXT: pdftotext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          node scripts/verify-pedagogy-print.mjs
      - name: Pedagogy Firestore Rules
        run: npx firebase-tools@15.25.0 emulators:exec --project demo-ecoscolaire --only firestore "npx playwright test tests/security/pedagogy-rules.spec.mjs tests/security/pedagogy-lot-b-rules.spec.mjs tests/security/pedagogy-lot-c-rules.spec.mjs --config=playwright.rules.config.ts"
      - name: Pedagogy Storage Rules
        run: npx firebase-tools@15.25.0 emulators:exec --project demo-ecoscolaire --only storage "npx playwright test tests/security/pedagogy-storage-rules.spec.mjs --config=playwright.rules.config.ts"
      - name: Pedagogy Lot A browser regression
        env:
          VITE_USE_FIREBASE_EMULATORS: "true"
          VITE_FIREBASE_API_KEY: emulator-api-key
          VITE_FIREBASE_AUTH_DOMAIN: localhost
          VITE_FIREBASE_PROJECT_ID: demo-ecoscolaire
          VITE_FIREBASE_STORAGE_BUCKET: demo-ecoscolaire.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
        run: npx firebase-tools@15.25.0 emulators:exec --project demo-ecoscolaire --only firestore,auth,functions "npx playwright test tests/pedagogy-lot-a-emulator-e2e.spec.ts --workers=1"
      - name: Pedagogy Lot B browser workflow
        env:
          VITE_USE_FIREBASE_EMULATORS: "true"
          VITE_FIREBASE_API_KEY: emulator-api-key
          VITE_FIREBASE_AUTH_DOMAIN: localhost
          VITE_FIREBASE_PROJECT_ID: demo-ecoscolaire
          VITE_FIREBASE_STORAGE_BUCKET: demo-ecoscolaire.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
        run: >-
          npx firebase-tools@15.25.0 emulators:exec --project demo-ecoscolaire
          --only firestore,auth,functions,storage
          "npx playwright test tests/pedagogy-lot-b-emulator-e2e.spec.ts --workers=1"
      - name: Pedagogy Lot C browser workflow
        env:
          VITE_USE_FIREBASE_EMULATORS: "true"
          VITE_FIREBASE_API_KEY: emulator-api-key
          VITE_FIREBASE_AUTH_DOMAIN: localhost
          VITE_FIREBASE_PROJECT_ID: demo-ecoscolaire
          VITE_FIREBASE_STORAGE_BUCKET: demo-ecoscolaire.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
        run: >-
          npx firebase-tools@15.25.0 emulators:exec --project demo-ecoscolaire
          --only firestore,auth,functions
          "npx playwright test tests/pedagogy-lot-c-emulator-e2e.spec.ts --workers=1"
      - name: Pedagogy canonical results browser workflow
        env:
          VITE_USE_FIREBASE_EMULATORS: "true"
          VITE_FIREBASE_API_KEY: emulator-api-key
          VITE_FIREBASE_AUTH_DOMAIN: localhost
          VITE_FIREBASE_PROJECT_ID: demo-ecoscolaire
          VITE_FIREBASE_STORAGE_BUCKET: demo-ecoscolaire.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
        run: >-
          npx firebase-tools@15.25.0 emulators:exec --project demo-ecoscolaire
          --only firestore,auth,functions
          "npx playwright test tests/pedagogy-results-emulator-e2e.spec.ts --workers=1"
