name: Limited Parameters Staging
on:
  push:
    branches: [codex/limited-parameters-production]
permissions:
  contents: read
  actions: read
concurrency:
  group: limited-parameters-staging
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - run: npm run build
      - run: npm run lint:ci
      - run: node scripts/check-staging-credential-regressions.mjs
      - run: node --test tests/security/limited-parameters-release.spec.mjs tests/security/settings-calendar-preservation.spec.mjs
      - run: npx vitest run tests/unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rules
        env:
          FIREBASE_PROJECT: demo-ecoscolaire
      - run: npm install -g firebase-tools@15.25.0
      - name: Financial integration on Firestore emulator
        run: firebase emulators:exec --project demo-ecoscolaire --only firestore "node tests/functions/test-all-school-fees.cjs && node tests/functions/test-student-account-collections.cjs && node tests/functions/test-financial-advantage-workflow.cjs && node tests/functions/test-financial-tariff-snapshots.cjs && node tests/security/all-school-fees-rules.mjs"
  staging:
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    env:
      GOOGLE_CLOUD_PROJECT: ecoscolaire-staging
      VITE_FIREBASE_PROJECT_ID: ecoscolaire-staging
      VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
      EXPECTED_STAGING_SHA: ${{ github.sha }}
      ALL_FEES_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Guard isolated branch and Staging project
        run: |
          test "$GITHUB_REF" = refs/heads/codex/limited-parameters-production
          test "$GOOGLE_CLOUD_PROJECT" = ecoscolaire-staging
          test "$VITE_FIREBASE_PROJECT_ID" = ecoscolaire-staging
          test "$(git rev-parse HEAD)" = "$EXPECTED_STAGING_SHA"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - run: npm install -g firebase-tools@15.25.0
      - name: Deploy only this release backend to Staging
        run: |
          targets="$(node -e 'console.log(["firestore:rules",...require("./scripts/limited-parameters-functions.json").map(n=>"functions:"+n)].join(","))')"
          node scripts/run-firebase-deploy-fail-closed.mjs -- firebase deploy --only "$targets" --project ecoscolaire-staging --non-interactive
      - name: Verify all scoped Functions are ACTIVE
        run: |
          for function_name in $(node -e 'console.log(require("./scripts/limited-parameters-functions.json").join(" "))'); do
            status="$(gcloud functions describe "$function_name" --project ecoscolaire-staging --region us-central1 --format='value(status)')"
            test "$status" = ACTIVE
          done
      - name: Find and verify immutable Preview for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-limited-staging-preview.mjs
      - run: npx playwright install --with-deps chromium
      - name: Global Settings actual UI validation
        run: node scripts/test-settings-global-staging.mjs
      - name: Financial collection actual UI validation with synthetic payments only
        run: node scripts/test-all-school-fees-staging.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: limited-parameters-staging-evidence
          path: |
            all-fees-*.png
            all-fees-receipt.pdf
          if-no-files-found: ignore
